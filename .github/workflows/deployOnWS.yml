      - name: Show flowdesk-backend logs
        if: always()
        run: |
            $env:PATH += ";C:\Users\Administrator\AppData\Roaming\npm"
            $env:PM2_HOME = "C:\ProgramData\pm2\home"
            pm2 logs flowdesk-backend --lines 50 --nostream

